name: Security checks

# Shared checks: local copy of my-stuffff/security-checks scan.yml (public repo cannot call a private workflow).
# Pull request: fails only on problems the PR adds (leaked key, unsafe code pattern, unsafe workflow).
# Monday 03:30 PKT: full scan incl. git history -> issue "Security checks: weekly findings".
# Package holes: Security -> Dependabot.

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: '30 22 * * 0' # Sunday 22:30 UTC = Monday 03:30 PKT
  workflow_dispatch:

permissions: {}

concurrency:
  group: security-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/security-scan.yml
